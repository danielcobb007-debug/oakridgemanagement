<!doctype html>
<html><head><meta charset="utf-8">
<title>ORM Surfaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf9f6; --rule:#e0dccc; --text:#1f2937; --muted:#4b5563; --light:#9ca3af; --navy:#142b4a; --bronze:#8a6a2a; }
  body { margin: 0; padding: 22px 24px; background: var(--bg); font-family: 'Inter', sans-serif; }
  h2 { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; color: var(--bronze); text-transform: uppercase; margin: 0 0 16px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: #ebe7d7; border: 1px solid #ebe7d7; }
  .sw { padding: 14px; }
  .chip { height: 56px; margin-bottom: 10px; border: 1px solid rgba(0,0,0,0.04); }
  .name { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--navy); margin-bottom: 2px; }
  .role { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .hex { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text); }
</style></head><body>
  <h2>ORM · Surface Scale (Warm Stone)</h2>
  <div class="row">
    <div class="sw" style="background:#ffffff"><div class="chip" style="background:#ffffff"></div><div class="name">Card</div><div class="role">White</div><div class="hex">#FFFFFF</div></div>
    <div class="sw" style="background:#faf9f6"><div class="chip" style="background:#faf9f6"></div><div class="name">Canvas</div><div class="role">Stone</div><div class="hex">#FAF9F6</div></div>
    <div class="sw" style="background:#f4f2eb"><div class="chip" style="background:#f4f2eb"></div><div class="name">Alt</div><div class="role">Alt section</div><div class="hex">#F4F2EB</div></div>
    <div class="sw" style="background:#ede9de"><div class="chip" style="background:#ede9de"></div><div class="name">Subtle</div><div class="role">Table head</div><div class="hex">#EDE9DE</div></div>
    <div class="sw" style="background:#ebe7d7"><div class="chip" style="background:#ebe7d7"></div><div class="name">Rule soft</div><div class="role">Hairline</div><div class="hex">#EBE7D7</div></div>
    <div class="sw" style="background:#e0dccc"><div class="chip" style="background:#e0dccc"></div><div class="name">Rule</div><div class="role">Hairline+</div><div class="hex">#E0DCCC</div></div>
  </div>
</body></html>
