<!doctype html>
<html><head><meta charset="utf-8">
<title>Spacing — ORM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 22px 24px; background: #faf9f6; font-family: 'Inter', sans-serif; color: #1f2937; }
  .row { display: flex; flex-direction: column; gap: 9px; }
  .item { display: flex; align-items: center; gap: 14px; }
  .label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.4px; color: #9ca3af; text-transform: uppercase; width: 76px; flex-shrink: 0; }
  .bar { height: 8px; background: #8a6a2a; }
  .val { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #4b5563; margin-left: auto; }
</style></head><body>
  <div class="row">
    <div class="item"><div class="label">sp-1</div><div class="bar" style="width:4px"></div><div class="val">4px</div></div>
    <div class="item"><div class="label">sp-2</div><div class="bar" style="width:8px"></div><div class="val">8px</div></div>
    <div class="item"><div class="label">sp-3</div><div class="bar" style="width:12px"></div><div class="val">12px</div></div>
    <div class="item"><div class="label">sp-4</div><div class="bar" style="width:16px"></div><div class="val">16px · default gap</div></div>
    <div class="item"><div class="label">sp-5</div><div class="bar" style="width:20px"></div><div class="val">20px</div></div>
    <div class="item"><div class="label">sp-6</div><div class="bar" style="width:24px"></div><div class="val">24px · card pad</div></div>
    <div class="item"><div class="label">sp-7</div><div class="bar" style="width:32px"></div><div class="val">32px · wrap pad</div></div>
    <div class="item"><div class="label">sp-8</div><div class="bar" style="width:40px"></div><div class="val">40px</div></div>
    <div class="item"><div class="label">sp-9</div><div class="bar" style="width:56px"></div><div class="val">56px · column gap</div></div>
    <div class="item"><div class="label">sp-10</div><div class="bar" style="width:72px"></div><div class="val">72px · section pad</div></div>
    <div class="item"><div class="label">sp-11</div><div class="bar" style="width:96px"></div><div class="val">96px · hero pad</div></div>
  </div>
</body></html>
