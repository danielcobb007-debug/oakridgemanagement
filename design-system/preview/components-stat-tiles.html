<!doctype html>
<html><head><meta charset="utf-8">
<title>Stat Tiles · ORM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 22px 24px; background: #faf9f6; font-family: 'Inter', sans-serif; color: #1f2937; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr 1fr; } }
  .tile { background: #fff; border: 1px solid #ebe7d7; padding: 20px 18px; position: relative; }
  .tile::before { content: ''; position: absolute; top: 0; left: 0; width: 28px; height: 2px; background: #8a6a2a; }
  .label { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: 0.4px; color: #4b5563; text-transform: uppercase; margin-bottom: 12px; }
  .value { font-family: 'Source Serif 4', Georgia, serif; font-weight: 500; font-size: 32px; line-height: 1.05; color: #142b4a; letter-spacing: -0.4px; }
  .sub { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #4b5563; margin-top: 8px; letter-spacing: 0.3px; }
</style></head><body>
  <div class="row">
    <div class="tile"><div class="label">Operating Domains</div><div class="value">Four</div><div class="sub">Platform · IP · Capital · Intelligence</div></div>
    <div class="tile"><div class="label">Active Workstreams</div><div class="value">Six</div><div class="sub">DGE&amp;I · CEH™ · QumulusAI · SPVs · …</div></div>
    <div class="tile"><div class="label">Platform Form</div><div class="value">Command Layer</div><div class="sub">Coordinated, not consolidated</div></div>
    <div class="tile"><div class="label">Coverage</div><div class="value">Private Mkts</div><div class="sub">Infra · Compute · Energy</div></div>
  </div>
</body></html>
