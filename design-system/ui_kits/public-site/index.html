<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oak Ridge Management — Private Operating Platform</title>
<meta name="description" content="Oak Ridge Management is a private operating and strategy platform coordinating platform architecture, capital formation, market standards, strategic investments, and operating intelligence across infrastructure, compute, energy, and complex private markets.">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" href="../../assets/orm-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="orm-public.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="OperatingDomains.jsx"></script>
  <script type="text/babel" src="CurrentThesis.jsx"></script>
  <script type="text/babel" src="ActiveWorkstreams.jsx"></script>
  <script type="text/babel" src="OperatingPrinciples.jsx"></script>
  <script type="text/babel" src="OperatingPerimeter.jsx"></script>
  <script type="text/babel" src="FounderCard.jsx"></script>
  <script type="text/babel" src="StrategicConversations.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <React.Fragment>
          <Nav active="" />
          <main>
            <Hero />
            <OperatingDomains />
            <CurrentThesis />
            <ActiveWorkstreams />
            <OperatingPrinciples />
            <OperatingPerimeter />
            <FounderCard />
            <StrategicConversations />
          </main>
          <Footer />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    const nav = document.getElementById('site-nav');
    if (nav) {
      window.addEventListener('scroll', () => {
        nav.classList.toggle('scrolled', window.scrollY > 10);
      }, { passive: true });
    }
  </script>
</body>
</html>
