<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DGE&amp;I Investor Portal — Restricted Partner Access</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../../assets/dg-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="partner-portal.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="OrmRibbon.jsx"></script>
  <script type="text/babel" src="InvestorNav.jsx"></script>
  <script type="text/babel" src="PortalHero.jsx"></script>
  <script type="text/babel" src="PortalModules.jsx"></script>
  <script type="text/babel" src="SitePortfolio.jsx"></script>
  <script type="text/babel" src="PowerBlocks.jsx"></script>
  <script type="text/babel" src="CapitalArchitecture.jsx"></script>
  <script type="text/babel" src="DataRoom.jsx"></script>
  <script type="text/babel" src="PortalFooter.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <React.Fragment>
          <OrmRibbon />
          <InvestorNav active="overview" />
          <main className="portal">
            <PortalHero
              onRequestAccess={(e) => { e.preventDefault(); document.getElementById('overview')?.scrollIntoView({ behavior: 'smooth' }); }}
              onLogin={(e) => { e.preventDefault(); alert('In production: routes to /login (credentialed)'); }}
            />
            <PortalModules />
            <SitePortfolio />
            <PowerBlocks />
            <CapitalArchitecture />
            <DataRoom />
          </main>
          <PortalFooter />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
